name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0). Leave empty when triggered by a tag push."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish to npm + GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node ≥22.14 and npm ≥11.5.1
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - run: npm run pack:smoke
      - run: npm run test:security
        env:
          ACCT_SECRET_BACKEND: file
      - run: npm run test:e2e
        env:
          ACCT_SECRET_BACKEND: file

      - name: Resolve release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vX.Y.Z (got: $tag)" >&2
            exit 1
          fi
          version="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
          test -s "docs/releases/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npmjs.org (skip if version already exists)
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          if npm view "acct-sh@$version" version >/dev/null 2>&1; then
            echo "acct-sh@$version already on npmjs.org — skipping"
          else
            # Auth via npm Trusted Publishing (OIDC).
            # setup-node + registry-url injects NODE_AUTH_TOKEN from secrets.NPM_TOKEN
            # when present; classic tokens override OIDC and fail with E403/E404
            # (npm also restricts tokens that bypass 2FA for direct publish).
            # https://docs.npmjs.com/trusted-publishers/
            # https://github.com/actions/setup-node/issues/1551
            unset NODE_AUTH_TOKEN
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            fi
            npm publish --access public
          fi

      # GitHub Packages requires a scope matching the repo owner.
      # Keep npmjs name as acct-sh; publish a scoped twin here.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          scoped="@${owner}/acct-sh"

          {
            echo "@${owner}:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } >> .npmrc

          if npm view "${scoped}@${version}" --registry=https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "${scoped}@${version} already on GitHub Packages — skipping"
            exit 0
          fi

          npm pkg set "name=${scoped}"
          # Already built + tested above; avoid re-running prepublishOnly
          npm publish --registry=https://npm.pkg.github.com --access public --ignore-scripts

      - name: Verify both registry versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$PACKAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          npm_version="$(npm view "acct-sh@$RELEASE_VERSION" version --registry=https://registry.npmjs.org)"
          github_version="$(npm view "@$owner/acct-sh@$RELEASE_VERSION" version --registry=https://npm.pkg.github.com)"
          test "$npm_version" = "$RELEASE_VERSION"
          test "$github_version" = "$RELEASE_VERSION"
          echo "Verified acct-sh@$npm_version on npm and @$owner/acct-sh@$github_version on GitHub Packages"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: acct-sh ${{ steps.tag.outputs.tag }}
          generate_release_notes: false
          body_path: docs/releases/${{ steps.tag.outputs.tag }}.md

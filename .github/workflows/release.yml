name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0). Leave empty when triggered by a tag push."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node ≥22.14 and npm ≥11.5.1
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run pack:check

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "Tag must look like vX.Y.Z (got: $tag)" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (skip if version already exists)
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          if npm view "acct-sh@$version" version >/dev/null 2>&1; then
            echo "acct-sh@$version already on npm — skipping publish"
          else
            # Auth via npm Trusted Publishing (OIDC). Do not set NODE_AUTH_TOKEN.
            npm publish --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            **Install:** `npm install -g acct-sh`

            npm: https://www.npmjs.com/package/acct-sh

            CLI bins: `acct`, `git-credential-acct`

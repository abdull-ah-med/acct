name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  package:
    name: Package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check
      - name: Verify package contents
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          tar -tzf "$tgz" | tee /tmp/acct-pack.list
          grep -q '^package/bin/acct.js$' /tmp/acct-pack.list
          grep -q '^package/bin/git-credential-acct.js$' /tmp/acct-pack.list
          grep -q '^package/dist/cli/index.js$' /tmp/acct-pack.list
          grep -q '^package/LICENSE$' /tmp/acct-pack.list
          grep -q '^package/README.md$' /tmp/acct-pack.list
          # Source and tests must stay out of the published tarball
          if grep -E '^package/(src|tests)/' /tmp/acct-pack.list; then
            echo "Published package must not include src/ or tests/" >&2
            exit 1
          fi
          rm -f "$tgz"

  e2e:
    name: E2E
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          ACCT_SECRET_BACKEND: file
